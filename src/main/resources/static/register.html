<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文档管理系统 - 注册</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-body">
                    <h3 class="text-center mb-4">📝 用户注册</h3>
                    <form id="registerForm">
                        <div class="form-group">
                            <label>用户名</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="form-group">
                            <label>密码</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="form-group">
                            <label>确认密码</label>
                            <input type="password" class="form-control" id="confirmPassword" required>
                        </div>
                        <div class="form-group">
                            <label>邮箱（可选）</label>
                            <input type="email" class="form-control" id="email">
                        </div>
                        <button type="submit" class="btn btn-success btn-block">注册</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="login.html">已有账号？立即登录</a>
                    </div>
                    <div id="message" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const email = document.getElementById('email').value;
        const msgDiv = document.getElementById('message');

        if (password !== confirm) {
            msgDiv.innerHTML = '<div class="alert alert-warning">两次密码输入不一致</div>';
            return;
        }

        try {
            const response = await fetch('/api/user/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password, email})
            });
            const data = await response.json();
            if (data.code === 200) {
                msgDiv.innerHTML = '<div class="alert alert-success">注册成功，3秒后跳转到登录页</div>';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            } else {
                msgDiv.innerHTML = '<div class="alert alert-danger">' + data.message + '</div>';
            }
        } catch (err) {
            msgDiv.innerHTML = '<div class="alert alert-danger">注册失败，请稍后重试</div>';
        }
    });
</script>
</body>
</html>
